name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            source: --source
          - runner: windows-2025
            target: windows-x86_64
            source: ''
          - runner: macos-14
            target: macos-arm64
            source: ''
          - runner: macos-15-intel
            target: macos-x86_64
            source: ''
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: true
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0
      - run: uv sync --locked
      - run: uv run --locked python tools/check.py
      - run: uv run --locked python tools/package.py ${{ matrix.source }}
      - run: uv run --locked python tools/smoke_bundle.py
      - name: Install and remove Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          cd "$RUNNER_TEMP"
          sts-studio --demo scan --first 1 --last 3
          sts-studio-gui --demo --smoke
          sudo apt-get remove -y sts-studio
      - name: Save packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sts-studio-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.tar.xz
            dist/*.deb
            dist/SHA256SUMS-*.txt

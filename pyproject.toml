[project]
name = "sts-studio"
version = "0.6.1"
description = "FEETECH servo configuration and monitoring with a desktop GUI and JSON CLI"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials>=6.8,<7", "pyserial>=3.5,<4"]

license = "MIT"
authors = [{name = "kotek"}]

[project.urls]
Repository = "https://github.com/kotek-7/sts-studio"
Issues = "https://github.com/kotek-7/sts-studio/issues"

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18", "types-pyserial>=3.5", "pytest>=8", "pytest-qt>=4.5", "pyinstaller>=6.16,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
sts-studio = "sts_studio.cli:main"

[project.gui-scripts]
sts-studio-gui = "sts_studio.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sts_studio"]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "sts_studio/resources/spec"
"docs" = "sts_studio/resources/docs"
"pyproject.toml" = "sts_studio/resources/pyproject.toml"
"LICENSE" = "sts_studio/resources/LICENSE"
"THIRD_PARTY_NOTICES.md" = "sts_studio/resources/THIRD_PARTY_NOTICES.md"


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["work", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/sts_studio"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sts_studio.contracts", "sts_studio.jobs", "sts_studio.runtime.*", "sts_studio.wire", "sts_studio.service", "sts_studio.catalog", "sts_studio.automation", "sts_studio.ui.signals", "sts_studio.ui.widgets"]
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true

[project]
name = "sts-studio"
version = "0.4.0"
description = "Native desktop servo configuration and monitoring"
requires-python = ">=3.12,<3.13"
dependencies = ["PyQt5>=5.15.11,<6", "pyserial>=3.5,<4"]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18", "types-pyserial>=3.5", "pytest>=8", "pytest-qt>=4.5"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["work", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyqt5"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/sts_studio"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sts_studio.contracts", "sts_studio.jobs", "sts_studio.runtime.*", "sts_studio.wire", "sts_studio.service", "sts_studio.catalog", "sts_studio.automation", "sts_studio.ui.signals", "sts_studio.ui.widgets"]
disallow_untyped_defs = true
disallow_untyped_calls = true
warn_return_any = true
